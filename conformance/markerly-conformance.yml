standards:
- id: ratelimit-headers
  name: IETF RateLimit header fields for HTTP (draft)
  conforms: true
  evidence: >-
    Live 200 on https://media-processor-65la52ndha-uc.a.run.app/ returned
    ratelimit-policy: 100;w=900, ratelimit-limit: 100, ratelimit-remaining: 99,
    ratelimit-reset: 900 — the standard field names, with the legacy X-RateLimit-*
    variants explicitly disabled.
  note: Retry-After is not sent on 429; the retry hint is body-only.

