compliance_certifications:
  published: false
  detail: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, or FedRAMP claim appears on markerly.com.
    The Terms of Use page (https://markerly.com/tos, which carries the privacy
    policy) describes Texas privacy rights, a Do Not Track statement, and a
    minors policy, but names no certification or audited framework. Notable
    given that Markerly runs influencer campaigns for government agencies and
    public-health clients, a buyer segment that normally asks for one.
