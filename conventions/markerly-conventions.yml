notes: >-
  Markerly publishes no API design guide, style guide, or conventions page.
  Everything below is read off the one callable surface the company operates.
  Several rows are honest negatives: recording that a convention is absent is
  the finding.

authentication:
  style: none
  detail: The service is unauthenticated; see authentication/markerly-authentication.yml.

idempotency:
  supported: false
  header: null
  detail: >-
    No Idempotency-Key header is read or documented. POST /generate-thumbnail is
    naturally idempotent in effect — the same videoUrl, timePosition, size, and
    quality render the same JPEG and nothing is persisted server-side — but the
    service offers no idempotency key, no replay window, and no deduplication
    guarantee, so a retried request simply repeats the FFmpeg work and consumes
    quota again. No Idempotency pointer is emitted for this provider.

