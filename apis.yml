apis:
- aid: markerly:media-processor
  name: Markerly Media Processor
  description: >-
    A first-party FFmpeg media-processing microservice Markerly runs on Google
    Cloud Run. It exposes two documented JSON/HTTP operations — a health check
    and a thumbnail generator that renders a JPEG frame from a Google Cloud
    Storage video URL — plus a self-describing root endpoint that lists them.
    The service is unauthenticated and publicly reachable, sends standard
    RateLimit-* response headers, and its full source, rate-limiting policy, and
    error envelope are published in Markerly's own public GitHub organization.
    It is operated as an internal component of Markerly's campaign-reporting
    pipeline (the source comments describe it as an internal microservice), not
    marketed as a developer product, and Markerly publishes no OpenAPI for it.
  humanURL: https://github.com/Markerly/media-processor-microservice
  baseURL: https://media-processor-65la52ndha-uc.a.run.app
