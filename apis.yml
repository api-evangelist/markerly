name: Markerly
description: >-
  Markerly is a full-service influencer marketing agency, running creator
  campaigns since 2012 across strategy, vetted-creator sourcing, content,
  activation, and real-time measurement. Two specialties set the Austin, Texas
  agency apart: influencer campaigns for government agencies, public health, and
  nonprofits (advocacy), and bilingual/multicultural creator campaigns. Markerly
  runs its creator network and client reporting on its own platform — a creator
  portal at markerly.creatorsaurus.com and a social-account connect app at
  api.markerly.com that links Instagram, Facebook Pages, and TikTok accounts —
  and it operates one publicly reachable first-party HTTP service, the Media
  Processor microservice on Google Cloud Run, whose source, endpoints, rate
  limits, and error envelope are published openly in the company's own GitHub
  organization. Markerly publishes no OpenAPI, no developer portal, and no
  self-serve API program; per third-party reviews, API access for external
  integrations is bundled into its white-label platform tier rather than sold
  as a standalone product.
